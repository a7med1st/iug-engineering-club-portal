services:
  postgres:
    image: postgres:16-alpine
    container_name: iug-engineering-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: engineering
      POSTGRES_DB: engineering_club
    ports:
      - "55432:5432"
    volumes:
      - engineering_club_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineering -d engineering_club"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  engineering_club_pgdata:
